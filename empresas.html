<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de Empresas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topnav" id="topnav"></div>
<div class="wrap">

  <header>
    <h1>Cadastro de Empresas</h1>
    <div class="sub">Nome e responsável.</div>
  </header>

  <section>
    <h2 id="form-title">Nova empresa</h2>
    <div class="grid">
      <div>
        <label for="nome">Nome da empresa</label>
        <input type="text" id="nome" placeholder="ex: Acme Contabilidade" autocomplete="off">
      </div>
      <div>
        <label for="resp">Responsável</label>
        <input type="text" id="resp" placeholder="ex: Maria Souza" autocomplete="off">
      </div>
    </div>
    <div class="error" id="erro"></div>
    <div class="actions">
      <button id="salvar">Salvar</button>
      <button class="ghost" id="cancelar" hidden>Cancelar</button>
    </div>
  </section>

  <section>
    <h2>Empresas cadastradas (<span id="total">0</span>)</h2>
    <input type="text" id="busca" class="search" placeholder="Filtrar por nome ou responsável..." autocomplete="off">
    <ul class="list" id="lista"></ul>
    <div class="empty-state" id="vazio">Carregando...</div>
  </section>
</div>

<script type="module">
import { montarCabecalho, api, esc, norm, toast } from "./app.js";

{
  const $ = (id) => document.getElementById(id);
  montarCabecalho($("topnav"));

  const elNome = $("nome"), elResp = $("resp"), elSalvar = $("salvar"), elCancelar = $("cancelar"),
        elTitle = $("form-title"), elErro = $("erro"), elBusca = $("busca"),
        elLista = $("lista"), elVazio = $("vazio"), elTotal = $("total");

  let empresas = [];
  let contagem = {};
  let editandoId = null;

  async function carregar() {
    [empresas, contagem] = await Promise.all([api.listarEmpresas(), api.contarPorEmpresa()]);
    render();
  }

  /* ---------- Formulário ---------- */
  async function salvar() {
    const nome = elNome.value.trim();
    const resp = elResp.value.trim();
    elErro.textContent = "";
    if (!nome) { elNome.focus(); elErro.textContent = "Informe o nome da empresa."; return; }

    // Checagem local — o banco também tem índice único como garantia final.
    const dup = empresas.find((e) => norm(e.nome) === norm(nome) && e.id !== editandoId);
    if (dup) { elNome.focus(); elErro.textContent = "Já existe uma empresa com esse nome."; return; }

    elSalvar.disabled = true;
    try {
      if (editandoId) {
        await api.atualizarEmpresa(editandoId, nome, resp);
        toast("Empresa atualizada.");
      } else {
        await api.criarEmpresa(nome, resp);
        toast("Empresa cadastrada.");
      }
      limparForm();
      await carregar();
    } catch (e) {
      elErro.textContent = e.message || "Não foi possível salvar.";
    } finally {
      elSalvar.disabled = false;
    }
  }

  function editar(id) {
    const e = empresas.find((x) => x.id === id);
    if (!e) return;
    editandoId = id;
    elNome.value = e.nome;
    elResp.value = e.responsavel || "";
    elTitle.textContent = "Editando empresa";
    elSalvar.textContent = "Salvar alterações";
    elCancelar.hidden = false;
    elErro.textContent = "";
    elNome.focus();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function limparForm() {
    editandoId = null;
    elNome.value = "";
    elResp.value = "";
    elTitle.textContent = "Nova empresa";
    elSalvar.textContent = "Salvar";
    elCancelar.hidden = true;
    elErro.textContent = "";
  }

  async function excluir(id) {
    const e = empresas.find((x) => x.id === id);
    if (!e) return;
    const qtd = contagem[id] || 0;
    const msg = qtd
      ? `Excluir "${e.nome}" e suas ${qtd} anotação(ões)?`
      : `Excluir "${e.nome}"?`;
    if (!confirm(msg)) return;
    try {
      await api.excluirEmpresa(id);
      if (editandoId === id) limparForm();
      await carregar();
      toast("Empresa excluída.");
    } catch { /* erro já reportado */ }
  }

  elSalvar.addEventListener("click", salvar);
  elCancelar.addEventListener("click", limparForm);
  [elNome, elResp].forEach((input) =>
    input.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") { ev.preventDefault(); salvar(); }
      if (ev.key === "Escape" && editandoId) limparForm();
    })
  );

  /* ---------- Lista ---------- */
  function render() {
    const filtro = norm(elBusca.value);
    const lista = filtro
      ? empresas.filter((e) => norm(e.nome).includes(filtro) || norm(e.responsavel).includes(filtro))
      : empresas;

    elTotal.textContent = empresas.length;

    if (!lista.length) {
      elLista.innerHTML = "";
      elVazio.hidden = false;
      elVazio.textContent = empresas.length
        ? "Nenhuma empresa corresponde ao filtro."
        : "Nenhuma empresa cadastrada ainda.";
      return;
    }
    elVazio.hidden = true;
    elLista.innerHTML = lista.map((e) => {
      const link = `empresa.html?id=${encodeURIComponent(e.id)}`;
      const qtd = contagem[e.id] || 0;
      const acoes =
        `<a class="ghost" href="${link}">Abrir</a>` +
        `<button class="ghost" data-edit="${e.id}">Editar</button>` +
        `<button class="ghost danger" data-del="${e.id}">Excluir</button>`;

      return (
        "<li>" +
          '<div class="info">' +
            `<div class="nome"><a href="${link}">${esc(e.nome)}</a></div>` +
            `<div class="resp">${e.responsavel ? esc(e.responsavel) : "sem responsável"} · ${qtd} anotação(ões)</div>` +
          "</div>" +
          `<div class="acts">${acoes}</div>` +
        "</li>"
      );
    }).join("");
  }

  elLista.addEventListener("click", (ev) => {
    const btn = ev.target.closest("button");
    if (!btn) return;
    if (btn.dataset.edit) editar(btn.dataset.edit);
    else if (btn.dataset.del) excluir(btn.dataset.del);
  });
  elBusca.addEventListener("input", render);

  await carregar();
}
</script>
</body>
</html>
