<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conta · Cofre de Informações</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topnav" id="topnav"></div>
<div class="wrap">

  <header>
    <h1>Conta</h1>
    <div class="sub" id="sub"></div>
  </header>

  <section>
    <h2>Alterar senha</h2>
    <div class="field">
      <label for="nova">Nova senha</label>
      <input type="password" id="nova" autocomplete="new-password" placeholder="mínimo 6 caracteres">
    </div>
    <div class="field">
      <label for="repete">Repita a nova senha</label>
      <input type="password" id="repete" autocomplete="new-password" placeholder="••••••••">
    </div>
    <div class="error" id="erro"></div>
    <div class="actions">
      <button id="salvar">Salvar nova senha</button>
      <span class="hint">Vale só para esta conta; a troca é imediata.</span>
    </div>
  </section>
</div>

<script type="module">
import { exigirLogin, montarCabecalho, sb, toast } from "./app.js";

const sessao = await exigirLogin();
if (sessao) {
  const $ = (id) => document.getElementById(id);
  await montarCabecalho($("topnav"), sessao);

  $("sub").textContent = sessao.user.email;

  const elNova = $("nova"), elRepete = $("repete"), elErro = $("erro"), elBtn = $("salvar");

  async function salvar() {
    const nova = elNova.value;
    const repete = elRepete.value;
    elErro.textContent = "";

    if (nova.length < 6) { elNova.focus(); elErro.textContent = "A senha precisa de pelo menos 6 caracteres."; return; }
    if (nova !== repete) { elRepete.focus(); elErro.textContent = "As duas senhas não são iguais."; return; }

    elBtn.disabled = true;
    elBtn.textContent = "Salvando...";
    try {
      const { error } = await sb.auth.updateUser({ password: nova });
      if (error) throw error;
      elNova.value = elRepete.value = "";
      toast("Senha alterada. Use a nova no próximo login.");
    } catch (e) {
      const msg = String(e.message || e);
      elErro.textContent = /should be different|same as/i.test(msg)
        ? "A nova senha precisa ser diferente da atual."
        : msg;
    } finally {
      elBtn.disabled = false;
      elBtn.textContent = "Salvar nova senha";
    }
  }

  elBtn.addEventListener("click", salvar);
  [elNova, elRepete].forEach((el) =>
    el.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); salvar(); } })
  );
  elNova.focus();
}
</script>
</body>
</html>
