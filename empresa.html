<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessão da Empresa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topnav" id="topnav"></div>
<div class="wrap">

  <header>
    <h1 id="nome">Carregando...</h1>
    <div class="sub" id="responsavel"></div>
  </header>

  <div id="conteudo" hidden>
    <section>
      <h2>Links fixados</h2>
      <div class="pins" id="pins"></div>
      <div id="pins-form" hidden>
        <div class="field">
          <label for="drive">Drive — pasta de arquivos</label>
          <input type="text" id="drive" placeholder="https://drive.google.com/drive/folders/..." autocomplete="off">
        </div>
        <div class="field">
          <label for="canva">Canva — pasta</label>
          <input type="text" id="canva" placeholder="https://www.canva.com/folder/..." autocomplete="off">
        </div>
        <div class="actions">
          <button id="salvar-links">Salvar links</button>
          <button class="ghost" id="cancelar-links">Cancelar</button>
        </div>
      </div>
      <div class="actions" id="pins-acoes" hidden>
        <button class="ghost" id="editar-links">Editar links</button>
      </div>
    </section>

    <section>
      <h2>Tarefas (<span id="tarefas-pendentes">0</span> pendente(s))</h2>
      <div class="row">
        <input type="text" id="tarefa-nova" placeholder="ex: enviar relatório de agosto" autocomplete="off" maxlength="200">
        <button id="tarefa-add">Adicionar</button>
      </div>
      <ul class="list tarefas" id="tarefas" style="margin-top:14px"></ul>
      <div class="empty-state" id="tarefas-vazio">Nenhuma tarefa para esta empresa.</div>
    </section>

    <section>
      <h2>Nova anotação</h2>
      <textarea id="note" placeholder="ex: senha do painel: abc123"></textarea>
      <div class="actions">
        <button id="save">Salvar anotação</button>
        <span class="hint">Ctrl+Enter salva</span>
      </div>
    </section>

    <section>
      <h2>Anotações (<span id="total">0</span>)</h2>
      <input type="text" id="filtro" class="search" placeholder="Filtrar anotações..." autocomplete="off">
      <ul class="list notes" id="notes"></ul>
      <div class="empty-state" id="empty"></div>
    </section>
  </div>

  <section id="erro" hidden>
    <div class="empty-state">
      Empresa não encontrada. <a href="empresas.html">Ver cadastro de empresas</a>.
    </div>
  </section>
</div>

<script type="module">
import {
  montarCabecalho, api, esc, norm, fmtDate, toast, copiar,
  conteudoComLinks, normalizarUrl,
} from "./app.js";

{
  const $ = (id) => document.getElementById(id);
  montarCabecalho($("topnav"));

  const id = new URLSearchParams(location.search).get("id");
  const empresa = id ? await api.obterEmpresa(id) : null;

  if (!empresa) {
    $("nome").textContent = "Empresa não encontrada";
    $("erro").hidden = false;
    document.title = "Empresa não encontrada";
  } else {
    $("nome").textContent = empresa.nome;
    $("responsavel").textContent =
      empresa.responsavel ? "Responsável: " + empresa.responsavel : "Sem responsável definido";
    document.title = empresa.nome + " · Cofre";
    $("conteudo").hidden = false;

    /* ---------- Links fixados: Drive e Canva ---------- */
    const elPins = $("pins"), elPinsForm = $("pins-form"), elPinsAcoes = $("pins-acoes"),
          elDrive = $("drive"), elCanva = $("canva");

    const PINS = [
      { chave: "link_drive", rotulo: "Drive", campo: () => elDrive },
      { chave: "link_canva", rotulo: "Canva", campo: () => elCanva },
    ];

    function renderPins() {
      const definidos = PINS.filter((p) => empresa[p.chave]);
      elPins.innerHTML = definidos.length
        ? definidos.map((p) =>
            `<a class="pin" href="${esc(empresa[p.chave])}" target="_blank" rel="noopener noreferrer" ` +
            `title="${esc(empresa[p.chave])}">${p.rotulo}<span class="ext">↗</span></a>`
          ).join("")
        : `<div class="empty-state">Nenhum link fixado — use 'Editar links'.</div>`;
      elPinsAcoes.hidden = false;
    }

    function abrirFormPins() {
      elDrive.value = empresa.link_drive || "";
      elCanva.value = empresa.link_canva || "";
      elPinsForm.hidden = false;
      elPinsAcoes.hidden = true;
      elDrive.focus();
    }
    function fecharFormPins() {
      elPinsForm.hidden = true;
      elPinsAcoes.hidden = false;
    }

    async function salvarLinks() {
      const drive = normalizarUrl(elDrive.value);
      const canva = normalizarUrl(elCanva.value);
      $("salvar-links").disabled = true;
      try {
        await api.atualizarLinks(empresa.id, drive, canva);
        empresa.link_drive = drive;
        empresa.link_canva = canva;
        fecharFormPins();
        renderPins();
        toast("Links salvos.");
      } catch { /* erro já reportado */ } finally {
        $("salvar-links").disabled = false;
      }
    }

    $("editar-links").addEventListener("click", abrirFormPins);
    $("cancelar-links").addEventListener("click", fecharFormPins);
    $("salvar-links").addEventListener("click", salvarLinks);
    [elDrive, elCanva].forEach((el) =>
      el.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") { ev.preventDefault(); salvarLinks(); }
        if (ev.key === "Escape") fecharFormPins();
      })
    );
    renderPins();

    /* ---------- Tarefas da empresa ---------- */
    const elTarefas = $("tarefas"), elTarefaNova = $("tarefa-nova"),
          elTarefaAdd = $("tarefa-add"), elTarefasVazio = $("tarefas-vazio");

    let tarefas = [];
    let editandoTarefa = null;

    async function carregarTarefas() {
      tarefas = await api.listarTarefasEmpresa(empresa.id);
      renderTarefas();
    }

    function renderTarefas() {
      $("tarefas-pendentes").textContent = tarefas.filter((t) => !t.concluida).length;

      if (!tarefas.length) {
        elTarefas.innerHTML = "";
        elTarefasVazio.hidden = false;
        return;
      }
      elTarefasVazio.hidden = true;

      elTarefas.innerHTML = tarefas.map((t) => {
        if (t.id === editandoTarefa) {
          return (
            `<li>` +
              `<input type="text" class="edit-input" id="edit-${t.id}" value="${esc(t.titulo)}" maxlength="200">` +
              `<div class="acts">` +
                `<button class="ghost" data-save="${t.id}">Salvar</button>` +
                `<button class="ghost" data-cancel="1">Cancelar</button>` +
              `</div>` +
            `</li>`
          );
        }
        return (
          `<li class="${t.concluida ? "feita" : ""}">` +
            `<label class="check">` +
              `<input type="checkbox" data-toggle="${t.id}"${t.concluida ? " checked" : ""}>` +
              `<span class="titulo">${esc(t.titulo)}</span>` +
            `</label>` +
            `<div class="acts">` +
              `<button class="ghost" data-edit="${t.id}">Editar</button>` +
              `<button class="ghost danger" data-del="${t.id}">Excluir</button>` +
            `</div>` +
          `</li>`
        );
      }).join("");

      if (editandoTarefa) {
        const campo = $("edit-" + editandoTarefa);
        if (campo) {
          campo.focus();
          campo.setSelectionRange(campo.value.length, campo.value.length);
          campo.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter") { ev.preventDefault(); salvarEdicao(editandoTarefa); }
            if (ev.key === "Escape") { editandoTarefa = null; renderTarefas(); }
          });
        }
      }
    }

    async function adicionarTarefa() {
      const titulo = elTarefaNova.value.trim();
      if (!titulo) { elTarefaNova.focus(); return toast("Escreva a tarefa."); }
      elTarefaAdd.disabled = true;
      try {
        await api.criarTarefaEmpresa(empresa.id, titulo);
        elTarefaNova.value = "";
        await carregarTarefas();
      } catch { /* erro já reportado */ } finally {
        elTarefaAdd.disabled = false;
        elTarefaNova.focus();
      }
    }

    async function salvarEdicao(id) {
      const campo = $("edit-" + id);
      if (!campo) return;
      const titulo = campo.value.trim();
      if (!titulo) { campo.focus(); return toast("A tarefa não pode ficar vazia."); }
      const t = tarefas.find((x) => x.id === id);
      if (t && titulo === t.titulo) { editandoTarefa = null; return renderTarefas(); }
      try {
        await api.atualizarTarefaEmpresa(id, { titulo });
        editandoTarefa = null;
        await carregarTarefas();
        toast("Tarefa atualizada.");
      } catch { /* erro já reportado */ }
    }

    elTarefaAdd.addEventListener("click", adicionarTarefa);
    elTarefaNova.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") { ev.preventDefault(); adicionarTarefa(); }
    });

    elTarefas.addEventListener("click", async (ev) => {
      const check = ev.target.closest("input[data-toggle]");
      if (check) {
        const t = tarefas.find((x) => x.id === check.dataset.toggle);
        if (!t) return;
        check.disabled = true;
        try {
          await api.atualizarTarefaEmpresa(t.id, { concluida: check.checked });
          await carregarTarefas();
        } catch {
          check.checked = t.concluida; // desfaz o visual se o banco recusou
        } finally {
          check.disabled = false;
        }
        return;
      }

      const btn = ev.target.closest("button");
      if (!btn) return;

      if (btn.dataset.edit) { editandoTarefa = btn.dataset.edit; renderTarefas(); }
      else if (btn.dataset.cancel) { editandoTarefa = null; renderTarefas(); }
      else if (btn.dataset.save) { salvarEdicao(btn.dataset.save); }
      else if (btn.dataset.del) {
        const t = tarefas.find((x) => x.id === btn.dataset.del);
        if (!t || !confirm(`Excluir a tarefa "${t.titulo}"?`)) return;
        try {
          await api.excluirTarefaEmpresa(t.id);
          await carregarTarefas();
          toast("Tarefa excluída.");
        } catch { /* erro já reportado */ }
      }
    });

    /* ---------- Anotações ---------- */
    const elNote = $("note"), elNotes = $("notes"), elEmpty = $("empty"),
          elTotal = $("total"), elFiltro = $("filtro"), elSave = $("save");

    let anotacoes = [];

    async function carregar() {
      anotacoes = await api.listarAnotacoes(empresa.id);
      render();
    }

    async function salvar() {
      const conteudo = elNote.value.trim();
      if (!conteudo) { elNote.focus(); return toast("Escreva a informação."); }
      elSave.disabled = true;
      try {
        await api.criarAnotacao(empresa.id, conteudo);
        elNote.value = "";
        await carregar();
        toast("Anotação salva.");
        elNote.focus();
      } catch { /* erro já reportado */ } finally {
        elSave.disabled = false;
      }
    }

    elSave.addEventListener("click", salvar);
    elNote.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); salvar(); }
    });

    function render() {
      const f = norm(elFiltro.value);
      const lista = f ? anotacoes.filter((a) => norm(a.conteudo).includes(f)) : anotacoes;
      elTotal.textContent = anotacoes.length;

      if (!lista.length) {
        elNotes.innerHTML = "";
        elEmpty.hidden = false;
        elEmpty.textContent = anotacoes.length
          ? "Nenhuma anotação corresponde ao filtro."
          : "Nenhuma anotação para esta empresa ainda.";
        return;
      }
      elEmpty.hidden = true;
      elNotes.innerHTML = lista.map((a) => {
        return (
          "<li>" +
            '<div class="body">' +
              `<div class="content">${conteudoComLinks(a.conteudo)}</div>` +
              `<div class="date">${fmtDate(a.data_criacao)}</div>` +
            "</div>" +
            '<div class="acts">' +
              `<button class="ghost" data-copy="${a.id}">Copiar</button>` +
              `<button class="ghost danger" data-del="${a.id}">Excluir</button>` +
            "</div>" +
          "</li>"
        );
      }).join("");
    }

    elNotes.addEventListener("click", async (ev) => {
      const btn = ev.target.closest("button");
      if (!btn) return;
      const alvo = btn.dataset.copy || btn.dataset.del;
      const a = anotacoes.find((x) => x.id === alvo);
      if (!a) return;
      if (btn.dataset.copy) {
        copiar(a.conteudo);
      } else if (confirm("Excluir esta anotação?")) {
        try {
          await api.excluirAnotacao(alvo);
          await carregar();
          toast("Anotação excluída.");
        } catch { /* erro já reportado */ }
      }
    });
    elFiltro.addEventListener("input", render);

    await Promise.all([carregar(), carregarTarefas()]);
    elTarefaNova.focus();
  }
}
</script>
</body>
</html>
