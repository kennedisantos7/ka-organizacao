<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessão da Empresa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar" id="topbar"></div>

  <header>
    <h1 id="nome">Carregando...</h1>
    <div class="sub" id="responsavel"></div>
    <div class="actions" id="compartilhar-area" hidden>
      <button class="ghost" id="compartilhar"></button>
      <span class="hint" id="compartilhar-hint"></span>
    </div>
  </header>

  <div id="conteudo" hidden>
    <section>
      <h2>Nova anotação</h2>
      <textarea id="note" placeholder="ex: senha do painel: abc123"></textarea>
      <div class="actions">
        <button id="save">Salvar anotação</button>
        <span class="hint">Ctrl+Enter salva</span>
      </div>
    </section>

    <section>
      <h2>Anotações (<span id="total">0</span>)</h2>
      <input type="text" id="filtro" class="search" placeholder="Filtrar anotações..." autocomplete="off">
      <ul class="list notes" id="notes"></ul>
      <div class="empty-state" id="empty"></div>
    </section>
  </div>

  <section id="erro" hidden>
    <div class="empty-state">
      Empresa não encontrada. <a href="empresas.html">Ver cadastro de empresas</a>.
    </div>
  </section>
</div>

<script type="module">
import { exigirLogin, montarTopbar, api, esc, norm, fmtDate, toast, copiar, conteudoComLinks } from "./app.js";

const sessao = await exigirLogin();
if (sessao) {
  const $ = (id) => document.getElementById(id);
  montarTopbar($("topbar"), sessao, [
    { href: "index.html", texto: "← Cofre" },
    { href: "empresas.html", texto: "Empresas" },
  ]);

  const id = new URLSearchParams(location.search).get("id");
  const empresa = id ? await api.obterEmpresa(id) : null;

  if (!empresa) {
    $("nome").textContent = "Empresa não encontrada";
    $("erro").hidden = false;
    document.title = "Empresa não encontrada";
  } else {
    const meu = empresa.user_id === sessao.user.id;

    $("nome").textContent = empresa.nome;
    $("responsavel").textContent =
      (empresa.responsavel ? "Responsável: " + empresa.responsavel : "Sem responsável definido") +
      (meu ? "" : " · empresa compartilhada com você");
    document.title = empresa.nome + " · Cofre";
    $("conteudo").hidden = false;

    /* ---------- Compartilhamento (só o dono controla) ---------- */
    if (meu) {
      const area = $("compartilhar-area"), btn = $("compartilhar"), hint = $("compartilhar-hint");
      area.hidden = false;

      const pintar = () => {
        btn.textContent = empresa.compartilhada ? "Desativar compartilhamento" : "Compartilhar com o outro membro";
        hint.textContent = empresa.compartilhada
          ? "O outro membro vê e pode anotar nesta empresa."
          : "Só você vê esta empresa.";
      };
      pintar();

      btn.addEventListener("click", async () => {
        const novo = !empresa.compartilhada;
        if (novo && !confirm(`Compartilhar "${empresa.nome}" com o outro membro do cofre?\n\nEle passa a ver e anotar informações desta empresa.`)) return;
        btn.disabled = true;
        try {
          await api.definirCompartilhamento(empresa.id, novo);
          empresa.compartilhada = novo;
          pintar();
          toast(novo ? "Empresa compartilhada." : "Compartilhamento removido.");
        } catch { /* erro já reportado */ } finally {
          btn.disabled = false;
        }
      });
    }

    const elNote = $("note"), elNotes = $("notes"), elEmpty = $("empty"),
          elTotal = $("total"), elFiltro = $("filtro"), elSave = $("save");

    let anotacoes = [];

    async function carregar() {
      anotacoes = await api.listarAnotacoes(empresa.id);
      render();
    }

    async function salvar() {
      const conteudo = elNote.value.trim();
      if (!conteudo) { elNote.focus(); return toast("Escreva a informação."); }
      elSave.disabled = true;
      try {
        await api.criarAnotacao(empresa.id, conteudo);
        elNote.value = "";
        await carregar();
        toast("Anotação salva.");
        elNote.focus();
      } catch { /* erro já reportado */ } finally {
        elSave.disabled = false;
      }
    }

    elSave.addEventListener("click", salvar);
    elNote.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); salvar(); }
    });

    function render() {
      const f = norm(elFiltro.value);
      const lista = f ? anotacoes.filter((a) => norm(a.conteudo).includes(f)) : anotacoes;
      elTotal.textContent = anotacoes.length;

      if (!lista.length) {
        elNotes.innerHTML = "";
        elEmpty.hidden = false;
        elEmpty.textContent = anotacoes.length
          ? "Nenhuma anotação corresponde ao filtro."
          : "Nenhuma anotação para esta empresa ainda.";
        return;
      }
      elEmpty.hidden = true;
      elNotes.innerHTML = lista.map((a) => {
        const minha = a.user_id === sessao.user.id;
        return (
          "<li>" +
            '<div class="body">' +
              `<div class="content">${conteudoComLinks(a.conteudo)}</div>` +
              `<div class="date">${fmtDate(a.data_criacao)}${minha ? "" : " · anotado pelo outro membro"}</div>` +
            "</div>" +
            '<div class="acts">' +
              `<button class="ghost" data-copy="${a.id}">Copiar</button>` +
              // Só o autor apaga a própria anotação.
              (minha ? `<button class="ghost danger" data-del="${a.id}">Excluir</button>` : "") +
            "</div>" +
          "</li>"
        );
      }).join("");
    }

    elNotes.addEventListener("click", async (ev) => {
      const btn = ev.target.closest("button");
      if (!btn) return;
      const alvo = btn.dataset.copy || btn.dataset.del;
      const a = anotacoes.find((x) => x.id === alvo);
      if (!a) return;
      if (btn.dataset.copy) {
        copiar(a.conteudo);
      } else if (confirm("Excluir esta anotação?")) {
        try {
          await api.excluirAnotacao(alvo);
          await carregar();
          toast("Anotação excluída.");
        } catch { /* erro já reportado */ }
      }
    });
    elFiltro.addEventListener("input", render);

    await carregar();
    elNote.focus();
  }
}
</script>
</body>
</html>
