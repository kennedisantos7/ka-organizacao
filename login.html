<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Cofre de Informações</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap narrow">
  <header>
    <h1>Cofre de Informações</h1>
    <div class="sub" id="modo-sub">Entre para acessar seus dados.</div>
  </header>

  <section>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" placeholder="voce@email.com">
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" placeholder="••••••••">
    </div>
    <div class="error" id="erro"></div>
    <div class="actions">
      <button class="wide" id="entrar">Entrar</button>
    </div>
  </section>
</div>

<script type="module">
import { sb, configurado } from "./app.js";

const $ = (id) => document.getElementById(id);
const elEmail = $("email"), elSenha = $("senha"), elErro = $("erro"), elBtn = $("entrar");

if (!configurado) {
  elErro.textContent = "config.js ainda não está preenchido. Veja SETUP.md.";
  elBtn.disabled = true;
}

// Se já houver sessão, vai direto para o destino.
const destino = new URLSearchParams(location.search).get("next") || "index.html";
if (configurado) {
  const { data } = await sb.auth.getSession();
  if (data.session) location.replace(destino);
}

async function enviar() {
  const email = elEmail.value.trim();
  const senha = elSenha.value;
  elErro.textContent = "";

  if (!email) { elEmail.focus(); elErro.textContent = "Informe o email."; return; }
  if (senha.length < 6) { elSenha.focus(); elErro.textContent = "A senha precisa de pelo menos 6 caracteres."; return; }

  elBtn.disabled = true;
  elBtn.textContent = "Entrando...";
  try {
    const { error } = await sb.auth.signInWithPassword({ email, password: senha });
    if (error) throw error;
    location.replace(destino);
  } catch (e) {
    const msg = String(e.message || e);
    elErro.textContent =
      /invalid login/i.test(msg) ? "Email ou senha incorretos."
      : /email.*confirm/i.test(msg) ? "Confirme seu email antes de entrar."
      : msg;
  } finally {
    elBtn.disabled = false;
    elBtn.textContent = "Entrar";
  }
}

elBtn.addEventListener("click", enviar);
[elEmail, elSenha].forEach((el) =>
  el.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); enviar(); } })
);
elEmail.focus();
</script>
</body>
</html>
