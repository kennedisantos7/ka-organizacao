<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cofre de Informações</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topnav" id="topnav"></div>
<div class="wrap">

  <header>
    <h1>Cofre de Informações</h1>
    <div class="sub">Pergunte em linguagem natural.</div>
  </header>


  <section>
    <h2>Perguntar</h2>
    <div class="row">
      <input type="text" id="question" placeholder="ex: qual a senha do painel da Empresa X?" autocomplete="off">
      <button id="ask">Buscar</button>
    </div>
    <div id="answer"></div>
  </section>

  <section>
    <h2>Nova anotação</h2>
    <div class="field">
      <label for="empresa-sel">Empresa</label>
      <select id="empresa-sel"><option>Carregando...</option></select>
    </div>
    <div class="field">
      <label for="note">Informação</label>
      <textarea id="note" placeholder="ex: senha do painel: abc123"></textarea>
    </div>
    <div class="actions">
      <button id="save">Salvar anotação</button>
      <span class="hint">Ctrl+Enter salva · <a href="empresas.html">cadastrar nova empresa</a></span>
    </div>
    <div class="hint" id="saved" style="margin-top:10px" hidden></div>
  </section>

  <section>
    <h2>Empresas</h2>
    <div class="companies" id="companies"></div>
    <div class="empty-state" id="companies-empty" hidden>
      Nenhuma empresa cadastrada. <a href="empresas.html">Cadastrar a primeira</a>.
    </div>
  </section>
</div>

<script type="module">
import {
  montarCabecalho, api, buscar, esc, fmtDate, toast, linkEmpresa,
  conteudoComLinks,
} from "./app.js";

{
  const $ = (id) => document.getElementById(id);
  montarCabecalho($("topnav"));

  const elQuestion = $("question"), elAnswer = $("answer"), elCompanies = $("companies"),
        elCompaniesEmpty = $("companies-empty"), elSel = $("empresa-sel"), elNote = $("note"),
        elSave = $("save"), elSaved = $("saved");

  let empresas = [];
  let anotacoes = [];

  async function carregar() {
    [empresas, anotacoes] = await Promise.all([api.listarEmpresas(), api.listarAnotacoes()]);
    renderSelect();
    renderCompanies();
  }

  /* ---------- Empresas ---------- */
  function renderSelect() {
    if (!empresas.length) {
      elSel.innerHTML = '<option value="">Nenhuma empresa cadastrada</option>';
      elSel.disabled = elNote.disabled = elSave.disabled = true;
      return;
    }
    const anterior = elSel.value;
    elSel.disabled = elNote.disabled = elSave.disabled = false;
    elSel.innerHTML =
      '<option value="">Selecione a empresa...</option>' +
      empresas.map((e) => `<option value="${esc(e.id)}">${esc(e.nome)}</option>`).join("");
    if (anterior) elSel.value = anterior;
  }

  function renderCompanies() {
    if (!empresas.length) {
      elCompanies.innerHTML = "";
      elCompaniesEmpty.hidden = false;
      return;
    }
    elCompaniesEmpty.hidden = true;
    elCompanies.innerHTML = empresas.map((e) => linkEmpresa(e.id, e.nome)).join("");
  }

  function nomeEmpresa(id) {
    const e = empresas.find((x) => x.id === id);
    return e ? e.nome : "—";
  }

  /* ---------- Pergunta ---------- */
  function semResposta(html) {
    elAnswer.innerHTML = `<div class="answer empty">${html}</div>`;
  }

  function perguntar() {
    const q = elQuestion.value.trim();
    if (!q) { elAnswer.innerHTML = ""; return; }

    if (!anotacoes.length) {
      return semResposta("Nenhuma anotação cadastrada ainda. Registre a primeira abaixo.");
    }

    const r = buscar(q, empresas, anotacoes);

    if (r.motivo === "sem-anotacoes") {
      return semResposta(
        `Encontrei a empresa <strong>${esc(r.empresa.nome)}</strong>, mas ela ainda não tem anotações. ` +
        linkEmpresa(r.empresa.id, "Abrir sessão da empresa →")
      );
    }
    if (!r.resultados.length) {
      return semResposta(
        r.empresa
          ? `Não há anotação de <strong>${esc(r.empresa.nome)}</strong> relacionada a essa pergunta. ` +
            linkEmpresa(r.empresa.id, "Abrir sessão da empresa →")
          : "Não identifiquei a empresa citada, e nenhuma anotação corresponde à pergunta."
      );
    }

    const melhor = r.resultados[0];
    const empresaId = r.empresa ? r.empresa.id : melhor.anotacao.empresa_id;
    const empresaNome = r.empresa ? r.empresa.nome : nomeEmpresa(melhor.anotacao.empresa_id);
    const aviso = r.empresa ? "" : " · empresa não identificada na pergunta, buscando em todas";

    let html =
      '<div class="answer">' +
      `<div class="meta">${esc(empresaNome)} · ${fmtDate(melhor.anotacao.data_criacao)}${aviso}</div>` +
      `<div class="content">${conteudoComLinks(melhor.anotacao.conteudo)}</div>`;

    const outros = r.resultados.slice(1);
    if (outros.length) {
      html +=
        '<div class="others">Outras anotações relacionadas:<ul>' +
        outros.map((o) => {
          const t = o.anotacao.conteudo;
          return `<li>${esc(t.slice(0, 120))}${t.length > 120 ? "…" : ""}</li>`;
        }).join("") +
        "</ul></div>";
    }
    html += `<div class="go">${linkEmpresa(empresaId, "Ver todas as anotações de " + empresaNome + " →")}</div></div>`;
    elAnswer.innerHTML = html;
  }

  $("ask").addEventListener("click", perguntar);
  elQuestion.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); perguntar(); }
  });

  /* ---------- Nova anotação ---------- */
  async function salvarAnotacao() {
    const empresaId = elSel.value;
    if (!empresaId) { elSel.focus(); return toast("Selecione a empresa."); }
    const conteudo = elNote.value.trim();
    if (!conteudo) { elNote.focus(); return toast("Escreva a informação."); }

    elSave.disabled = true;
    try {
      await api.criarAnotacao(empresaId, conteudo);
      elNote.value = "";
      anotacoes = await api.listarAnotacoes();
      elSaved.hidden = false;
      elSaved.innerHTML =
        `Salvo em <strong>${esc(nomeEmpresa(empresaId))}</strong>. ` + linkEmpresa(empresaId, "Ver anotações →");
      toast("Anotação salva.");
      elNote.focus();
    } catch { /* erro já reportado */ } finally {
      elSave.disabled = false;
    }
  }

  elSave.addEventListener("click", salvarAnotacao);
  elNote.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); salvarAnotacao(); }
  });
  elSel.addEventListener("change", () => { elSaved.hidden = true; });

  await carregar();
}
</script>
</body>
</html>
